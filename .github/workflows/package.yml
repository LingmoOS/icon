name: Package
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  deb:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: apt-get update -qq && apt-get install -y -qq build-essential cmake debhelper dpkg-dev qt6-base-dev qt6-svg-dev
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-icon-deb
          path: ../lingmo-icon*.deb
  rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install git
        run: dnf install -y git
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: dnf install -y cmake ninja-build rpm-build qt6-qtbase-devel qt6-qtsvg-devel
      - name: Build RPM
        run: |
          mkdir -p /tmp/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cd .. && tar czf /tmp/rpmbuild/SOURCES/lingmo-icon-1.0.0.tar.gz --transform='s,^lingmo-icon,lingmo-icon-1.0.0,' lingmo-icon
          cd lingmo-icon && cp rpm/lingmo-icon.spec /tmp/rpmbuild/SPECS/
          rpmbuild -ba /tmp/rpmbuild/SPECS/lingmo-icon.spec --define "_topdir /tmp/rpmbuild"
      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: lingmo-icon-rpm
          path: /tmp/rpmbuild/RPMS/**/*.rpm
